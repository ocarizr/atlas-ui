components:
  scripting:
    paths:
    - libs/scripting/**
    - tests/scripting/**
    depends_on: [mvvm]
    build_targets: [atlas_scripting, atlas_scripting_tests]
    test_labels: [scripting]
    build_requires: [mvvm]
    vendors: [testing, content]
  ui-scripting:
    paths:
    - libs/ui_scripting/**
    - tests/ui_scripting/**
    depends_on: [scripting, ui]
    build_targets: [atlas_ui_scripting, atlas_ui_scripting_tests]
    test_labels: [ui-scripting]
    build_requires: [scripting, ui]
    vendors: [testing, content]
  memory:
    paths:
    - libs/memory/**
    - tests/memory/**
    - tests/platform/windows/memory/**
    - benchmarks/memory/**
    depends_on: []
    build_targets:
    - atlas_memory
    - atlas_memory_tests
    - atlas_memory_benchmark
    test_labels:
    - memory
    build_requires: []
    vendors:
    - testing
    - memory
  memory-integration:
    paths:
    - tests/memory_integration/**
    - tests/platform/windows/memory_integration/**
    depends_on:
    - memory
    - jobs
    - streaming
    - renderer
    - jobs-diagnostics
    build_targets:
    - atlas_memory_integration_tests
    test_labels:
    - memory-integration
    build_requires:
    - memory
    - jobs
    - streaming
    - renderer
    - jobs-diagnostics
    vendors:
    - testing
    - memory
    - content
    - graphics
  diagnostics:
    paths:
    - libs/diagnostics/**
    - tests/diagnostics/**
    depends_on: []
    build_targets:
    - atlas_diagnostics
    - atlas_diagnostics_tests
    test_labels:
    - diagnostics
    build_requires: []
    vendors:
    - testing
    - content
  jobs-diagnostics:
    paths:
    - libs/jobs_diagnostics/**
    - tests/jobs_diagnostics/**
    depends_on:
    - jobs
    - diagnostics
    build_targets:
    - atlas_jobs_diagnostics
    - atlas_jobs_diagnostics_tests
    test_labels:
    - jobs-diagnostics
    build_requires:
    - jobs
    - diagnostics
    vendors:
    - testing
    - content
  jobs-benchmark:
    paths:
    - benchmarks/jobs/**
    depends_on:
    - jobs
    build_targets:
    - atlas_jobs_benchmark
    test_labels:
    - jobs-benchmark
    build_requires:
    - jobs
    vendors:
    - testing
  core:
    paths:
    - libs/foundation/**
    - libs/core/**
    - libs/config/**
    - libs/logging/**
    - libs/profiling/**
    - libs/ecs/**
    - tests/core/**
    - tests/ecs/**
    depends_on: []
    build_targets: []
    test_labels: []
  content:
    paths:
    - libs/asset_system/**
    - libs/serialization/**
    - tests/content/**
    depends_on:
    - core
    - streaming
    build_targets: []
    test_labels: []
  ui-mvvm:
    paths:
    - libs/ui_mvvm/**
    - tests/ui_mvvm/**
    depends_on:
    - mvvm
    - ui
    build_targets:
    - atlas_ui_mvvm
    - atlas_ui_mvvm_tests
    test_labels:
    - ui-mvvm
    build_requires:
    - mvvm
    - ui
    vendors:
    - testing
    - content
  mvvm-content:
    paths:
    - libs/mvvm_content/**
    - tests/mvvm_content/**
    depends_on:
    - mvvm
    build_targets:
    - atlas_mvvm_content
    - atlas_mvvm_content_tests
    - atlas_mvvm_fixture_generator
    test_labels:
    - mvvm-content
    build_requires:
    - mvvm
    vendors:
    - testing
    - content
  mvvm:
    paths:
    - libs/mvvm/**
    - benchmarks/mvvm/**
    - tests/mvvm/**
    depends_on:
    - diagnostics
    build_targets:
    - atlas_mvvm
    - atlas_mvvm_tests
    - atlas_mvvm_benchmark
    test_labels:
    - mvvm
    build_requires:
    - diagnostics
    vendors:
    - testing
    - content
  input:
    paths:
    - libs/input/**
    - libs/platform/windows/input/**
    - tests/input/**
    depends_on:
    - diagnostics
    build_targets:
    - atlas_input
    - atlas_input_tests
    test_labels:
    - input
    build_requires:
    - diagnostics
    vendors:
    - testing
    - content
  ui:
    # EnTT tree storage and XML geometry fixtures use the content vendor product.
    paths:
    - libs/ui/**
    # Shared host interaction is exercised as a UI consumer regression.
    - apps/common/demo_interaction.hpp
    - tests/ui/**
    - benchmarks/ui/**
    # UI probes reuse the jobs benchmark's allocation census, not its workload library.
    - benchmarks/jobs/allocation_counter.cpp
    - benchmarks/jobs/allocation_counter.hpp
    - benchmarks/jobs/allocation_counter_check.cpp
    depends_on:
    - input
    - diagnostics
    - jobs
    build_targets:
    - atlas_ui
    - atlas_ui_tests
    - atlas_ui_benchmark
    - atlas_ui_paint_benchmark
    test_labels:
    - ui
    build_requires:
    - input
    - diagnostics
    - jobs
    vendors:
    - testing
    - content
  ui-renderer:
    paths:
    - libs/ui_renderer/**
    - tests/ui_renderer/**
    - tests/platform/windows/ui_renderer/**
    depends_on:
    - ui
    - renderer
    - render-host
    build_targets:
    - atlas_ui_renderer
    - atlas_ui_renderer_tests
    test_labels:
    - ui-renderer
    build_requires:
    - ui
    - renderer
    - render-host
    vendors:
    - testing
    - content
    - graphics
  ui-images:
    paths:
    - libs/ui_images/**
    - tests/ui_images/**
    - tests/platform/windows/ui_images/**
    depends_on:
    - ui-renderer
    - renderer-content
    build_targets:
    - atlas_ui_images
    - atlas_ui_images_tests
    test_labels:
    - ui-images
    build_requires:
    - ui-renderer
    - renderer-content
    vendors:
    - testing
    - content
    - graphics
  ipc:
    paths:
    - protocols/**
    - libs/ipc/**
    - tests/ipc/**
    depends_on:
    - core
    build_targets:
    - atlas_protocol
    - atlas_protocol_tests
    test_labels:
    - ipc
    build_requires: []
    vendors:
    - testing
    - ipc
  game:
    paths:
    - apps/game/**
    - tests/game/**
    - apps/common/**
    depends_on:
    - ui-renderer
    - ui-images
    - application
    - renderer
    - renderer-jobs
    - renderer-content
    - render-host
    build_targets:
    - atlas_game
    - atlas_game_content
    test_labels:
    - game
    build_requires:
    - ui-renderer
    - ui-images
    - application
    - renderer
    - renderer-jobs
    - renderer-content
    - render-host
    vendors:
    - memory
    - ipc
    - content
    - graphics
  editor:
    paths:
    - apps/editor/**
    - tests/editor/**
    - apps/common/**
    depends_on:
    - ui-renderer
    - ui-images
    - application
    - renderer
    - renderer-jobs
    - renderer-content
    - render-host
    build_targets:
    - atlas_editor
    - atlas_editor_content
    test_labels:
    - editor
    build_requires:
    - ui-renderer
    - ui-images
    - application
    - renderer
    - renderer-jobs
    - renderer-content
    - render-host
    vendors:
    - memory
    - ipc
    - content
    - graphics
  tools:
    paths:
    - tools/**
    - tests/content_tools/**
    depends_on:
    - content
    - application
    build_targets:
    - atlas_cook
    - atlas_package
    test_labels:
    - tools
    build_requires:
    - application
    vendors:
    - memory
    - ipc
    - content
  jobs:
    paths:
    - benchmarks/jobs/phased_workload.*
    - libs/jobs/**
    - tests/jobs/**
    depends_on: []
    build_targets:
    - atlas_jobs
    - atlas_jobs_tests
    test_labels:
    - jobs
    build_requires: []
    vendors:
    - testing
  streaming:
    paths:
    - libs/streaming/**
    - libs/platform/windows/streaming/**
    - tests/streaming/**
    - tests/platform/windows/streaming/**
    depends_on:
    - jobs
    - dependencies
    - diagnostics
    build_targets:
    - atlas_streaming
    - atlas_streaming_tests
    test_labels:
    - streaming
    build_requires:
    - jobs
    - diagnostics
    vendors:
    - testing
    - media
    - content
  dependencies:
    paths:
    - libs/audio/**
    - tests/dependencies/**
    depends_on: []
    build_targets:
    - atlas_dependency_tests
    test_labels:
    - dependencies
    build_requires: []
    vendors:
    - testing
    - content
    - media
  windows:
    paths:
    - libs/platform/windows/CMakeLists.txt
    - tests/platform/windows/CMakeLists.txt
    - tests/platform/windows/windows_api_tests.cpp
    depends_on: []
    build_targets:
    - atlas_windows_tests
    test_labels:
    - windows
    build_requires: []
    vendors:
    - testing
    - graphics
  application:
    paths:
    - libs/application/**
    - tests/application/**
    depends_on:
    - memory
    - jobs
    - jobs-diagnostics
    - ipc
    - dependencies
    build_targets:
    - atlas_application
    - atlas_application_tests
    test_labels:
    - application
    build_requires:
    - memory
    - jobs-diagnostics
    - ipc
    vendors:
    - memory
    - testing
    - ipc
    - content
  window:
    paths:
    - libs/window/**
    - libs/platform/windows/window/**
    - tests/window/**
    - tests/platform/windows/window/**
    depends_on:
    - input
    build_targets:
    - atlas_window
    - atlas_window_tests
    test_labels:
    - window
    build_requires:
    - input
    vendors:
    - testing
    - content
  renderer:
    paths:
    - libs/renderer/**
    - libs/platform/windows/renderer/**
    - tests/renderer/**
    - tests/platform/windows/renderer/**
    depends_on:
    - window
    - diagnostics
    build_targets:
    - atlas_renderer
    - atlas_renderer_tests
    test_labels:
    - renderer
    build_requires:
    - window
    - diagnostics
    vendors:
    - testing
    - graphics
    - content
  renderer-jobs:
    paths:
    - libs/renderer_jobs/**
    - tests/renderer_jobs/**
    - tests/platform/windows/renderer_jobs/**
    - benchmarks/renderer/recording_benchmark.cpp
    - benchmarks/renderer/CMakeLists.txt
    depends_on:
    - renderer
    - jobs
    build_targets:
    - atlas_renderer_jobs
    - atlas_renderer_jobs_tests
    - atlas_renderer_benchmark
    test_labels:
    - renderer-jobs
    build_requires:
    - renderer
    - jobs
    vendors:
    - testing
    - graphics
    - content
  renderer-content:
    paths:
    - libs/renderer_content/**
    - libs/platform/windows/renderer_content/**
    - tests/renderer_content/**
    - tests/platform/windows/renderer_content/**
    - assets/renderer/**
    depends_on:
    - renderer
    - streaming
    build_targets:
    - atlas_renderer_content
    - atlas_renderer_content_tests
    test_labels:
    - renderer-content
    build_requires:
    - renderer
    - streaming
    vendors:
    - testing
    - graphics
    - content
  render-host:
    paths:
    - libs/render_host/**
    - tests/render_host/**
    depends_on:
    - window
    - diagnostics
    build_targets:
    - atlas_render_host
    - atlas_render_host_tests
    test_labels:
    - render-host
    build_requires:
    - window
    - diagnostics
    vendors:
    - testing
    - content
  renderer-readiness:
    paths:
    - tests/renderer_readiness/**
    - tests/platform/windows/renderer_readiness/**
    - benchmarks/renderer/readiness_benchmark.cpp
    depends_on:
    - renderer
    - render-host
    - renderer-content
    - renderer-jobs
    - memory
    build_targets:
    - atlas_renderer_readiness_tests
    - atlas_renderer_readiness_benchmark
    test_labels:
    - renderer-readiness
    build_requires:
    - renderer
    - render-host
    - renderer-content
    - renderer-jobs
    - memory
    vendors:
    - testing
    - graphics
    - content
    - memory
formatting_contexts:
  tooling:
  - scripts/**/*.py
  - tests/tooling/**
  - tests/support/**
formatting_global_paths:
- .clang-format
- .editorconfig
- .gitattributes
- pyproject.toml
- scripts/check_format.ps1
- scripts/ci/format_sources.py
- scripts/ci/format_selection.py
- scripts/ci/config.py
- scripts/ci/documentation.py
- scripts/ci/cpp_spacing.py
- scripts/ci/requirements.txt
- .ci/components.yaml
- .github/workflows/reusable_format.yml
- .github/workflows/reusable_plan.yml
- .github/workflows/reusable_validation.yml
- .github/actions/setup_ci/**
global_paths:
- CMakeLists.txt
- CMakePresets.json
- pytest.ini
- pyproject.toml
- cmake/**
- third_party/**
- .ci/**
- .github/**
- scripts/**
- tests/tooling/**
- tests/support/**
- .clang-*
- .editorconfig
- .gitattributes
- .gitignore
- vcpkg.json
- vcpkg-configuration.json
- dependencies/**
documentation_paths:
- libs/scripting/README.md
- libs/ui_scripting/README.md
- libs/mvvm/README.md
- libs/mvvm_content/README.md
- libs/ui_mvvm/README.md
- libs/input/README.md
- libs/diagnostics/README.md
- libs/jobs_diagnostics/README.md
- libs/jobs/README.md
- README.md
- CONTRIBUTING.md
- LICENSE
- docs/**
- libs/window/README.md
- libs/renderer/README.md
- libs/renderer_jobs/README.md
- libs/renderer_content/README.md
- libs/render_host/README.md
- libs/ui/README.md
- libs/ui_renderer/README.md
- libs/ui_images/README.md
asset_paths:
- assets/**
profiles:
- configure: windows-msvc
  configuration: Debug
- configure: windows-msvc
  configuration: Release
- configure: windows-asan
  configuration: Debug
- configure: windows-analysis
  configuration: Debug
- configure: windows-tidy
  configuration: Debug
- configure: windows-coverage
  configuration: Debug
- configure: windows-portable
  configuration: Debug
  exclude_components:
  - windows
