components:
  diagnostics:
    paths:
    - libs/diagnostics/**
    - tests/diagnostics/**
    depends_on: []
    build_targets:
    - atlas_diagnostics
    - atlas_diagnostics_tests
    test_labels:
    - diagnostics
    build_requires: []
    vendors:
    - testing
    - content
  jobs-diagnostics:
    paths:
    - libs/jobs_diagnostics/**
    - tests/jobs_diagnostics/**
    depends_on:
    - jobs
    - diagnostics
    build_targets:
    - atlas_jobs_diagnostics
    - atlas_jobs_diagnostics_tests
    test_labels:
    - jobs-diagnostics
    build_requires:
    - jobs
    - diagnostics
    vendors:
    - testing
    - content
  jobs-benchmark:
    paths:
    - benchmarks/jobs/**
    depends_on:
    - jobs
    build_targets:
    - atlas_jobs_benchmark
    test_labels:
    - jobs-benchmark
    build_requires:
    - jobs
    vendors:
    - testing
  core:
    paths:
    - libs/foundation/**
    - libs/core/**
    - libs/config/**
    - libs/logging/**
    - libs/profiling/**
    - libs/ecs/**
    - tests/core/**
    - tests/ecs/**
    depends_on: []
    build_targets: []
    test_labels: []
  content:
    paths:
    - libs/asset_system/**
    - libs/serialization/**
    - tests/content/**
    depends_on:
    - core
    - streaming
    build_targets: []
    test_labels: []
  ui:
    paths:
    - libs/ui/**
    - libs/mvvm/**
    - libs/animation/**
    - libs/video/**
    - libs/localization/**
    - libs/renderer/**
    - tests/ui/**
    depends_on:
    - core
    - content
    build_targets: []
    test_labels: []
  ipc:
    paths:
    - protocols/**
    - libs/ipc/**
    - tests/ipc/**
    depends_on:
    - core
    build_targets:
    - atlas_protocol
    - atlas_protocol_tests
    test_labels:
    - ipc
    build_requires: []
    vendors:
    - testing
    - ipc
  game:
    paths:
    - apps/game/**
    - tests/game/**
    depends_on:
    - ui
    - application
    build_targets:
    - atlas_game
    test_labels:
    - game
    build_requires:
    - application
    vendors:
    - ipc
    - content
  editor:
    paths:
    - apps/editor/**
    - tests/editor/**
    depends_on:
    - ui
    - application
    build_targets:
    - atlas_editor
    test_labels:
    - editor
    build_requires:
    - application
    vendors:
    - ipc
    - content
  tools:
    paths:
    - tools/**
    - tests/content_tools/**
    depends_on:
    - content
    - application
    build_targets:
    - atlas_cook
    - atlas_package
    test_labels:
    - tools
    build_requires:
    - application
    vendors:
    - ipc
    - content
  jobs:
    paths:
    - benchmarks/jobs/phased_workload.*
    - libs/jobs/**
    - tests/jobs/**
    depends_on: []
    build_targets:
    - atlas_jobs
    - atlas_jobs_tests
    test_labels:
    - jobs
    build_requires: []
    vendors:
    - testing
  streaming:
    paths:
    - libs/streaming/**
    - tests/streaming/**
    depends_on:
    - jobs
    - dependencies
    build_targets:
    - atlas_streaming
    - atlas_streaming_tests
    test_labels:
    - streaming
    build_requires:
    - jobs
    vendors:
    - testing
    - media
  dependencies:
    paths:
    - libs/audio/**
    - tests/dependencies/**
    depends_on: []
    build_targets:
    - atlas_dependency_tests
    test_labels:
    - dependencies
    build_requires: []
    vendors:
    - testing
    - content
    - media
  windows:
    paths:
    - libs/platform/windows/**
    - tests/platform/windows/**
    depends_on: []
    build_targets:
    - atlas_windows_tests
    test_labels:
    - windows
    build_requires: []
    vendors:
    - testing
    - graphics
  application:
    paths:
    - libs/application/**
    - tests/application/**
    depends_on:
    - jobs
    - jobs-diagnostics
    - ipc
    - dependencies
    build_targets:
    - atlas_application
    - atlas_application_tests
    test_labels:
    - application
    build_requires:
    - jobs-diagnostics
    - ipc
    vendors:
    - testing
    - ipc
    - content
global_paths:
- CMakeLists.txt
- CMakePresets.json
- pytest.ini
- cmake/**
- third_party/**
- .ci/**
- .github/**
- scripts/**
- tests/tooling/**
- tests/support/**
- .clang-*
- .editorconfig
- .gitattributes
- .gitignore
- vcpkg.json
- vcpkg-configuration.json
- dependencies/**
documentation_paths:
- libs/diagnostics/README.md
- libs/jobs_diagnostics/README.md
- libs/jobs/README.md
- README.md
- CONTRIBUTING.md
- LICENSE
- docs/**
asset_paths:
- assets/**
profiles:
- configure: windows-msvc
  configuration: Debug
- configure: windows-msvc
  configuration: Release
- configure: windows-asan
  configuration: Debug
- configure: windows-analysis
  configuration: Debug
- configure: windows-tidy
  configuration: Debug
- configure: windows-coverage
  configuration: Debug
- configure: windows-portable
  configuration: Debug
  exclude_components:
  - windows
