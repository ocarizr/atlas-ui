name: Main packaging and tagged releases
'on':
  push:
    branches:
    - main
    tags:
    - v*
    - V*
permissions:
  contents: read
  actions: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      version: ${{ steps.policy.outputs.version }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
    - name: Validate delivery ref and main ancestry
      id: policy
      env:
        DELIVERY_REF: ${{ github.ref }}
      run: python -m scripts.ci.release_policy --ref $env:DELIVERY_REF --github-output $env:GITHUB_OUTPUT
  package:
    needs:
    - gate
    - validation
    if: needs.gate.result == 'success' && needs.validation.result == 'success'
    uses: ./.github/workflows/reusable_package.yml
    with:
      version: ${{ needs.gate.outputs.version }}
  publish:
    needs:
    - gate
    - package
    if: always() && !cancelled() && needs.gate.result == 'success' && needs.package.result == 'success' && needs.gate.outputs.publish
      == 'true'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: atlas-windows-${{ github.sha }}
        path: release-assets
    - name: Publish the validated tag and package
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      run: |
        $task_assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
        if ($task_assets.Count -eq 0) { throw 'No release artifacts were downloaded.' }
        gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --title $env:RELEASE_TAG --generate-notes @task_assets
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  validation:
    needs: gate
    uses: ./.github/workflows/reusable_validation.yml
    with:
      full: true
      version: ${{ needs.gate.outputs.version }}
