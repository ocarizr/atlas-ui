name: Parallel component validation
'on':
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      version:
        type: string
        default: development
jobs:
  reference:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable_reference.yml
  plan:
    uses: ./.github/workflows/reusable_plan.yml
    with:
      full: ${{ inputs.full }}
  quality:
    needs: plan
    uses: ./.github/workflows/reusable_quality.yml
    with:
      tooling: ${{ needs.plan.outputs.tooling == 'true' }}
      configure: ${{ needs.plan.outputs.configure == 'true' }}
  format:
    needs: plan
    if: ${{ needs.plan.outputs.has-formatting == 'true' }}
    uses: ./.github/workflows/reusable_format.yml
    with:
      matrix: ${{ needs.plan.outputs.formatting }}
  vendor-testing:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.groups), 'testing') }}
    uses: ./.github/workflows/reusable_dependencies.yml
    with:
      group: testing
      key: ${{ fromJSON(needs.plan.outputs.keys).testing }}
  vendor-content:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.groups), 'content') }}
    uses: ./.github/workflows/reusable_dependencies.yml
    with:
      group: content
      key: ${{ fromJSON(needs.plan.outputs.keys).content }}
  vendor-media:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.groups), 'media') }}
    uses: ./.github/workflows/reusable_dependencies.yml
    with:
      group: media
      key: ${{ fromJSON(needs.plan.outputs.keys).media }}
  vendor-ipc:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.groups), 'ipc') }}
    uses: ./.github/workflows/reusable_dependencies.yml
    with:
      group: ipc
      key: ${{ fromJSON(needs.plan.outputs.keys).ipc }}
  vendor-graphics:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.groups), 'graphics') }}
    uses: ./.github/workflows/reusable_dependencies.yml
    with:
      group: graphics
      key: ${{ fromJSON(needs.plan.outputs.keys).graphics }}
  jobs:
    needs:
    - plan
    - vendor-testing
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'jobs') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: jobs
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).jobs) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  diagnostics:
    needs:
    - plan
    - vendor-testing
    - vendor-content
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'diagnostics') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: diagnostics
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).diagnostics) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  jobs-diagnostics:
    needs:
    - plan
    - vendor-testing
    - vendor-content
    - jobs
    - diagnostics
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'jobs-diagnostics') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: jobs-diagnostics
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices)['jobs-diagnostics']) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  jobs-benchmark:
    needs:
    - plan
    - vendor-testing
    - jobs
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'jobs-benchmark') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: jobs-benchmark
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices)['jobs-benchmark']) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  streaming:
    needs:
    - plan
    - vendor-testing
    - vendor-media
    - jobs
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'streaming') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: streaming
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).streaming) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  ipc:
    needs:
    - plan
    - vendor-testing
    - vendor-ipc
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'ipc') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: ipc
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).ipc) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  application:
    needs:
    - plan
    - vendor-testing
    - vendor-ipc
    - vendor-content
    - jobs-diagnostics
    - ipc
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'application') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: application
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).application) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  dependencies:
    needs:
    - plan
    - vendor-testing
    - vendor-content
    - vendor-media
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'dependencies') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: dependencies
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).dependencies) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  windows:
    needs:
    - plan
    - vendor-testing
    - vendor-graphics
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'windows') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: windows
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).windows) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  game:
    needs:
    - plan
    - vendor-ipc
    - vendor-content
    - application
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'game') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: game
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).game) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  editor:
    needs:
    - plan
    - vendor-ipc
    - vendor-content
    - application
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'editor') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: editor
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).editor) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  tools:
    needs:
    - plan
    - vendor-ipc
    - vendor-content
    - application
    if: ${{ contains(fromJSON(needs.plan.outputs.components), 'tools') }}
    uses: ./.github/workflows/reusable_build.yml
    with:
      component: tools
      version: ${{ inputs.version }}
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrices).tools) }}
      keys: ${{ needs.plan.outputs.keys }}
      upstream: ${{ toJSON(needs) }}
  required:
    name: Component validation
    if: always()
    needs:
    - plan
    - quality
    - format
    - reference
    - vendor-testing
    - vendor-content
    - vendor-media
    - vendor-ipc
    - vendor-graphics
    - jobs
    - diagnostics
    - jobs-diagnostics
    - jobs-benchmark
    - streaming
    - ipc
    - application
    - dependencies
    - windows
    - game
    - editor
    - tools
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
    - name: Require all selected checks
      shell: pwsh
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        $task_results = $env:RESULTS | ConvertFrom-Json -AsHashtable
        foreach ($task_entry in $task_results.GetEnumerator()) {
          if ($task_entry.Value.result -notin @('success', 'skipped')) { throw "Failed check: $($task_entry.Key)" }
        }
        if ($task_results.plan.result -ne 'success' -or $task_results.quality.result -ne 'success') { throw 'Planning or quality failed.' }
        if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $task_results.reference.result -ne 'success') { throw 'Doxygen reference generation failed.' }
        if ($task_results.plan.outputs.'has-formatting' -eq 'true' -and $task_results.format.result -ne 'success') { throw 'Selected formatting checks did not pass.' }
        $task_selected = $task_results.plan.outputs.components | ConvertFrom-Json
        foreach ($task_name in $task_selected) {
          if ($task_results[$task_name].result -ne 'success') { throw "Required component did not pass: $task_name" }
        }
