name: Compiled dependency product
'on':
  workflow_call:
    inputs:
      group:
        type: string
        required: true
      key:
        type: string
        required: true
    outputs:
      run-id:
        value: ${{ jobs.dependencies.outputs.run-id }}
defaults:
  run:
    shell: pwsh
jobs:
  dependencies:
    name: vendor-${{ inputs.group }}
    runs-on: windows-2022
    timeout-minutes: 140
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
      with:
        toolchain: 'true'
    - name: Locate compatible main dependency product
      id: lookup
      env:
        GH_TOKEN: ${{ github.token }}
        GROUP: ${{ inputs.group }}
        KEY: ${{ inputs.key }}
      run: python -m scripts.ci.vendor_artifacts --group $env:GROUP --key $env:KEY --github-output $env:GITHUB_OUTPUT
    - name: Recover compiled dependency product
      id: recover
      if: steps.lookup.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: vendor-${{ inputs.group }}-${{ inputs.key }}
        path: build/vendor/${{ inputs.group }}
        github-token: ${{ github.token }}
        run-id: ${{ steps.lookup.outputs.run-id }}
    - name: Restore partial binary archive cache
      if: steps.recover.outcome != 'success'
      id: cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: .tools/vcpkg-cache
        key: vendor-archives-${{ inputs.group }}-${{ inputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vendor-archives-${{ inputs.group }}-${{ inputs.key }}-
          vcpkg-v2-windows-msvc17-
          vcpkg-windows-msvc17-
    - name: Bootstrap pinned package manager
      if: steps.recover.outcome != 'success'
      run: ./scripts/bootstrap_dependencies.ps1
    - name: Build missing dependency product
      id: install
      if: steps.recover.outcome != 'success'
      timeout-minutes: 110
      env:
        GROUP: ${{ inputs.group }}
        KEY: ${{ inputs.key }}
      run: python -m scripts.ci.prepare_dependencies --group $env:GROUP --key $env:KEY
    - name: Verify dependency product identity
      env:
        GROUP: ${{ inputs.group }}
        KEY: ${{ inputs.key }}
      run: python -m scripts.ci.prepare_dependencies --group $env:GROUP --key $env:KEY --verify
    - name: Store compiled dependency product
      if: steps.recover.outcome != 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: vendor-${{ inputs.group }}-${{ inputs.key }}
        path: build/vendor/${{ inputs.group }}
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
        overwrite: true
    - name: Publish source run
      id: source
      env:
        RESTORED: ${{ steps.recover.outcome }}
        SOURCE_RUN: ${{ steps.lookup.outputs.run-id }}
      run: if ($env:RESTORED -eq "success") { "run-id=$env:SOURCE_RUN" >> $env:GITHUB_OUTPUT } else { "run-id=$env:GITHUB_RUN_ID"
        >> $env:GITHUB_OUTPUT }
    - name: Preserve partial archive progress
      if: always() && steps.cache.outcome == 'success'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: .tools/vcpkg-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Retain dependency diagnostics
      if: failure() || cancelled()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: dependency-diagnostics-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          reports/dependencies/**
          .tools/vcpkg/buildtrees/**/*.log
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
