name: Per-component validation
'on':
  workflow_call:
    inputs:
      version:
        type: string
        default: development
      component:
        type: string
        required: true
      matrix:
        type: string
        required: true
      keys:
        type: string
        required: true
      upstream:
        type: string
        required: true
jobs:
  component:
    name: ${{ inputs.component }} / ${{ matrix.configure }} / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
      with:
        toolchain: 'true'
    - uses: ./.github/actions/restore_inputs
      with:
        component: ${{ inputs.component }}
        configure: ${{ matrix.configure }}
        configuration: ${{ matrix.configuration }}
        keys: ${{ inputs.keys }}
        upstream: ${{ inputs.upstream }}
    - name: Build component and run its tests
      shell: pwsh
      env:
        COMPONENT: ${{ inputs.component }}
        CONFIGURE_PRESET: ${{ matrix.configure }}
        BUILD_CONFIGURATION: ${{ matrix.configuration }}
        ATLAS_CI_ARTIFACTS: '1'
        ATLAS_BUILD_VERSION: ${{ inputs.version }}
      run: python -m scripts.ci.build_component --component $env:COMPONENT --configure $env:CONFIGURE_PRESET --configuration
        $env:BUILD_CONFIGURATION --export-products
    - name: Share compiled component
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: owned-${{ inputs.component }}-${{ matrix.configure }}-${{ matrix.configuration }}-${{ github.sha }}
        path: build/products/${{ inputs.component }}
        retention-days: 1
        overwrite: true
        if-no-files-found: error
    - name: Retain component coverage
      if: matrix.configure == 'windows-coverage'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-${{ inputs.component }}
        path: build/windows-coverage/coverage/report.txt
        if-no-files-found: error
        retention-days: 7
