name: Package validated application products
'on':
  workflow_call:
    inputs:
      version:
        type: string
        required: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
    - name: Restore validated game
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: owned-game-windows-msvc-Release-${{ github.sha }}
        path: build/package_inputs/game
    - name: Restore validated editor
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: owned-editor-windows-msvc-Release-${{ github.sha }}
        path: build/package_inputs/editor
    - name: Restore validated tools
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: owned-tools-windows-msvc-Release-${{ github.sha }}
        path: build/package_inputs/tools
    - name: Package already compiled Release applications
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      shell: pwsh
      run: python -m scripts.ci.package_products --version $env:PACKAGE_VERSION
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: atlas-windows-${{ github.sha }}
        path: |
          build/packages/*.zip
          build/packages/*.sha256
        if-no-files-found: error
        retention-days: 14
