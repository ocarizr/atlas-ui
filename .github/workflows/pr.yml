name: Pull request validation
'on':
  pull_request:
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/reusable_validation.yml
  required:
    name: PR validation
    if: always()
    needs: validation
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
    - name: Require successful component pipelines
      shell: pwsh
      env:
        RESULT: ${{ needs.validation.result }}
      run: if ($env:RESULT -ne 'success') { throw 'Required validation failed.' }
