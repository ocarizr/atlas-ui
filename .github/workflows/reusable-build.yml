name: Component validation
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
jobs:
  component:
    name: ${{ matrix.configure }} / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          toolchain: 'true'
      - name: Build named targets and run labeled tests
        env:
          COMPONENTS: ${{ join(matrix.components, ' ') }}
          CONFIGURE_PRESET: ${{ matrix.configure }}
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        shell: pwsh
        run: |
          $taskComponents = $env:COMPONENTS.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          python -m scripts.ci.build_component --component @taskComponents --configure $env:CONFIGURE_PRESET --configuration $env:BUILD_CONFIGURATION
      - name: Retain coverage report
        if: matrix.configure == 'windows-coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-selected-components
          path: build/windows-coverage/coverage/report.txt
          if-no-files-found: error
