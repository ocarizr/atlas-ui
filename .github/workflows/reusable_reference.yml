name: Generate Doxygen reference
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reference:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
    - name: Validate documentation or generate main reference
      shell: pwsh
      env:
        SOURCE_REVISION: ${{ github.sha }}
        SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        REFERENCE_UPLOAD: ${{ inputs.upload }}
      run: |
        $task_doxygen = ./scripts/install_doxygen.ps1
        $task_options = @('--check')
        if ($env:REFERENCE_UPLOAD -eq 'true' -and $env:GITHUB_REF -eq 'refs/heads/main') { $task_options = @() }
        python -m scripts.ci.build_reference --doxygen $task_doxygen --repository $env:SOURCE_REPOSITORY --revision $env:SOURCE_REVISION @task_options
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Transfer verified reference to publisher
      if: inputs.upload && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: doxygen-reference-${{ github.sha }}
        path: build/documentation
        if-no-files-found: error
        retention-days: 14
