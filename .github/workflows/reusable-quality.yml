name: Repository quality
on:
  workflow_call:
    inputs:
      tooling:
        type: boolean
        default: false
      configure:
        type: boolean
        default: false
jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          toolchain: ${{ inputs.configure }}
      - name: Validate repository configuration and documentation
        run: python -m scripts.ci.check_repository
      - name: Validate mapped assets and XML
        run: python -m scripts.ci.validate_assets
      - name: Test validation tooling
        if: inputs.tooling
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Lint GitHub Actions workflows
        if: inputs.tooling
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check C++ formatting and analyzer configuration
        if: inputs.configure
        shell: pwsh
        run: |
          ./scripts/Check-Format.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-tidy --verify-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-format --style=file --dump-config | Out-Null
      - name: Configure development foundation
        if: inputs.configure
        run: cmake --preset windows-msvc
