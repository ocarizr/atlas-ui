name: Plan validation
'on':
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
    outputs:
      has-build:
        value: ${{ jobs.plan.outputs.has-build }}
      configure:
        value: ${{ jobs.plan.outputs.configure }}
      tooling:
        value: ${{ jobs.plan.outputs.tooling }}
      components:
        value: ${{ jobs.plan.outputs.components }}
      matrices:
        value: ${{ jobs.plan.outputs.matrices }}
      groups:
        value: ${{ jobs.plan.outputs.groups }}
      keys:
        value: ${{ jobs.plan.outputs.keys }}
      has-formatting:
        value: ${{ jobs.plan.outputs.has-formatting }}
      formatting:
        value: ${{ jobs.plan.outputs.formatting }}
jobs:
  plan:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      has-build: ${{ steps.impact.outputs.has-build }}
      configure: ${{ steps.impact.outputs.configure }}
      tooling: ${{ steps.impact.outputs.tooling }}
      components: ${{ steps.impact.outputs.components }}
      matrices: ${{ steps.impact.outputs.matrices }}
      groups: ${{ steps.impact.outputs.groups }}
      keys: ${{ steps.impact.outputs.keys }}
      has-formatting: ${{ steps.impact.outputs.has-formatting }}
      formatting: ${{ steps.impact.outputs.formatting }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup_ci
      with:
        toolchain: 'true'
    - name: Select affected components
      id: impact
      shell: pwsh
      env:
        FULL_VALIDATION: ${{ inputs.full }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if ($env:FULL_VALIDATION -eq 'true') {
          python -m scripts.ci.impact --all --github-output $env:GITHUB_OUTPUT
        } else {
          python -m scripts.ci.impact --base $env:BASE_SHA --head $env:HEAD_SHA --github-output $env:GITHUB_OUTPUT
        }
